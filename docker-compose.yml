version: "3.9"

services:

  mongo:
    image: mongo:7
    container_name: library_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: library_api
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://mongo:27017

volumes:
  mongo_data: